[package]
name = "gsc-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Google Search Console from the command line, built for humans and AI agents"
keywords = ["google-search-console", "seo", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "gsc_cli"
path = "src/lib.rs"

[[bin]]
name = "gsc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
toml = "1.2.1"
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
