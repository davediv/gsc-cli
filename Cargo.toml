[package]
name = "gsc-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Google Search Console from the command line, built for humans and AI agents"
keywords = ["google-search-console", "seo", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "gsc_cli"
path = "src/lib.rs"

[[bin]]
name = "gsc"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
csv = "1.4.0"
open = "5.4.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
unicode-width = "0.2.3"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2"
mockito = "1.7.2"
predicates = "3.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
